[project]
name = "local-llm"
version = "1.0.1"
description = "Benchmarks and recommended stacks for running coding agents against local models"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16",
    # local mirror of CI. The #227 commit guard is a language:python hook, so
    # pre-commit must be a real dependency (and `uv run pre-commit install`
    # must run) or a bare `git commit` never invokes it. Floor 3.2 is where the
    # `pre-commit` stage name replaced the deprecated `commit`.
    "pre-commit>=3.2",
]

# Note: no `exclude-newer-span` here. uv 0.12.1 rejects the field, and this
# project has no runtime dependencies -- pytest and ruff are the only things
# resolved. Add the field when uv moves past 0.12.1.

[tool.pytest.ini_options]
testpaths = ["."]
# The sandbox holds full checkouts of the target repositories, and those are
# real projects with real suites. Collected, they add ~500 tests that pass or
# fail for reasons that have nothing to do with this harness -- and one of them
# is deliberately excised mid-run, so it fails by design.
# Extends pytest's defaults rather than replacing them: dropping `.*`
# un-ignored .hypothesis, which the plugin then warned about.
norecursedirs = ["sandbox", "*.egg", ".*", "_darcs", "build", "CVS",
                 "dist", "node_modules", "venv", "{arch}"]
markers = [
    "integration: needs ~/git/gmail-archive at the pinned commit and uv",
    "slow: allocates real memory or takes seconds; not part of the default run",
    "real_stash_paths: reads this machine's real repositories; opts out of conftest's stash redirect",
]

[tool.ruff]
# Without this ruff parses as py311 and rejects f-string syntax that is valid
# on the interpreter this project actually runs -- nested same-quote and
# backslashes inside f-strings, both 3.12+, both already in the tests.
target-version = "py313"
# PROMPTS.md is generated by benchmarks/agent/gen_prompts.py and must match it
# byte for byte -- test_prompts_doc_is_current asserts exactly that. ruff
# formats the Python block inside that Markdown, rewriting
# `assert reverse_string('hello')` to "hello", which the generator never
# emits. The prompt IS the task, so a blanket `ruff format` silently edited
# what the model is asked and left the doc permanently at odds with its own
# generator. Nothing else here is configured: the rest stays on ruff defaults,
# which is what every existing check was written against.
extend-exclude = ["benchmarks/agent/PROMPTS.md"]

[tool.ruff.lint.per-file-ignores]
# The rows this reads carry naive local timestamps: results._now() writes them
# without an offset, and sweep-order.txt is `date +%H:%M:%S`. Fixtures must be
# naive to match the producer, so a tz-aware datetime here would be the wrong
# thing, not the safe thing. These were invisible until 2026-09-05, when a
# syntax error from a missing target-version was masking every other rule in
# the file.
"tests/test_stack_agent_report.py" = ["DTZ001"]
"tests/test_route_ab_report.py" = ["DTZ001"]
# Same producer, same reason: the anchor this test passes to
# read_windows stands in for a naive `date +%H:%M:%S` line.
"tests/test_route_agent_ab.py" = ["DTZ001"]
# `--until HH:MM` is a wall-clock cutoff on the machine doing the work, so
# resolve_until has to reason in local time with no zone attached: "23:59
# tonight" is not a UTC instant until it is resolved against today's date.
# The instant it returns is compared as a float, never as a string -- #175 is
# the bug where `[ "23:35" \< "2359" ]` was true because ':' sorts above '5'.
"scripts/lib/batch.py" = ["DTZ006", "DTZ007"]
"tests/test_batch.py" = ["DTZ001", "DTZ005", "DTZ006"]
