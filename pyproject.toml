[project]
name = "local-llm"
version = "0.1.0"
description = "Run Claude Code against local models served by Ollama"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0"]

# Note: no `exclude-newer-span` here. uv 0.12.1 rejects the field, and this
# project has no runtime dependencies -- pytest is the only thing resolved.
# Add it if that changes and uv is new enough.

[tool.pytest.ini_options]
testpaths = ["."]
# The sandbox holds full checkouts of the target repositories, and those are
# real projects with real suites. Collected, they add ~500 tests that pass or
# fail for reasons that have nothing to do with this harness -- and one of them
# is deliberately excised mid-run, so it fails by design.
# Extends pytest's defaults rather than replacing them: dropping `.*`
# un-ignored .hypothesis, which the plugin then warned about.
norecursedirs = ["sandbox", "*.egg", ".*", "_darcs", "build", "CVS",
                 "dist", "node_modules", "venv", "{arch}"]
markers = [
    "integration: needs ~/git/gmail-archive at the pinned commit and uv",
    "slow: allocates real memory or takes seconds; not part of the default run",
    "real_stash_paths: reads this machine's real repositories; opts out of conftest's stash redirect",
]

[tool.ruff]
# PROMPTS.md is generated by benchmarks/agent/gen_prompts.py and must match it
# byte for byte -- test_prompts_doc_is_current asserts exactly that. ruff
# formats the Python block inside that Markdown, rewriting
# `assert reverse_string('hello')` to "hello", which the generator never
# emits. The prompt IS the task, so a blanket `ruff format` silently edited
# what the model is asked and left the doc permanently at odds with its own
# generator. Nothing else here is configured: the rest stays on ruff defaults,
# which is what every existing check was written against.
extend-exclude = ["benchmarks/agent/PROMPTS.md"]
