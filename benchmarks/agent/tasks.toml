context_tokens = 100000
engine = "ds4"
engine_tree = "~/git/ds4-metal"
speculative = "mtp"
# Explicit, not defaulted: `DraftProbe.SWITCHES` is keyed on this, and a
# missing one makes the arm unreadable by the counter probe -- caught by
# test_every_declared_arm_names_an_engine_the_probe_can_read.
