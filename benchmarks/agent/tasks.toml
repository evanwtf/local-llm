# CAVEAT -- COST IS NOT ZERO. The disk baseline (benchmarks/disk/RESULTS.md)
# says a ~100-byte PLE lookup cannot cost less than one 4 KiB block: 61 us.
# One lookup per token is free; eight would put prefill 30% into disk wait, and
# #14 established that re-prefill dominates agent wall time here. "Lossless" in
# the source claim is about output, not about time. Read the suite wall clock,
# not just the verdict.
