# --- harder replay tasks (#726) -----------------------------------------------
# The seven tasks above are at their ceiling for the cluster's stacks (21/21
# each, #726), so these add two kinds of difficulty, still with no judge:
#
#   * `hidden_tests`: node ids cut out of the agent's tree before it starts
#     and run only by the oracle, recorded as `hidden_passed` beside the
#     visible `passed`. From the commit's own test files, chosen by
#     scripts/hidden_test_candidates.py: of the test functions that pass at
#     the commit and fail after the revert, the third with the smallest
#     sha256 of their node id -- reproducible, and blind to what each checks.
#     With `hidden_ref`, they are read from that later commit instead.
#   * `span_start`: revert a run of consecutive commits, span_start through
#     base_commit, not one; every path goes back to span_start^.
#
# Each hidden variant keeps its #714 task's commit, revert and prompt, plus
# one sentence saying hidden tests exist, under a new name, so the #714
# series stays comparable. `suite = "hard"` keeps them out of --replay; run
# them with --replay-hard. scripts/verify_replay_tasks.py proves each: the
# visible and hidden tests pass at the reference, the hidden ones twice
# identically, both fail after the revert, and no hidden test calls a name
# the agent cannot read.

