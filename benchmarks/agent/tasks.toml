# GLM-5.3-Flash on ds4 -- **the supported stack** (#38).
#
# antirez ships GLM for Mac through ds4 (DwarfStar) with his own GGUF layout and
# states plainly that ds4 is not a general GGUF loader. `backend.glm53` is the
# other thing: Unsloth's GGUF on llama.cpp PR #27752 through the shim. They are
# not interchangeable and the metadata proves it --
#
#   antirez GGUF (this)  general.architecture = glm5-next
#   Unsloth GGUF (glm53) general.architecture = glm5next
#
# -- which is also why #25 failed: PR #27773 declares one name and the file
# carries the other.
#
# The behavioural gap is large and was visible in the first coherence check,
# same prompt at temperature 0:
#
#   llama.cpp + Unsloth   ~76 s, 854 completion tokens (mostly reasoning)
#   ds4 + antirez          3.2 s,  47 completion tokens
#
# 18x fewer tokens. The reasoning explosion that timed out Claude Code on the
# other stack (12.11 t/s, 5-7k tokens per turn, 3600 s timeout) is a property of
# that stack, not of the model.
#
# No shim: ds4 serves /v1/messages, /v1/chat/completions and /v1/responses
# natively, so both clients reach it directly -- the same reason the ds4 primary
# works with Claude Code at 55/55.
#
# The weights were already on disk. They were downloaded for #25, found
# unloadable by every engine then available, and kept under the archive
# convention rather than deleted. This is the engine that reads them.
# GLM-5.3 on ds4, fronted by ds4_claude_shim.py (#50). Identical weights and
# server to glm53ds4; the shim rewrites two Claude Code behaviours that ds4 does
# not handle: thinking={type:adaptive} (which ds4 does not recognise, so every
# request ran think_mode:high) and the injected <total_tokens> counter (whose
# changing value pinned live_prompt_common at 20,321 while prompts grew to
# 30,781). Paired against glm53ds4 this isolates the client tax from the model.
[backend.glm53ds4shim]
description = "GLM-5.3-Flash Q2 on ds4 branch, via ds4_claude_shim (thinking + KV fix)"
base_url = "http://127.0.0.1:8100"
