# bf16, q8_0, q4_0, q4_1, iq4_nl, q5_0, q5_1 -- there is no fp8 KV type in
# this build, so the FP8 half of that recipe is not a flag we can set and
# gets its own arm at q8_0 rather than being folded in here.
#
# What this changes is the physical batch: -ub 512 -> 2048, with -b already
# 2048, so a prefill pass submits the whole logical batch in one physical
# chunk instead of four. That is the closest llama.cpp analogue to the
# chunked-prefill knob, and it is the same class of fix as the ggml_top_k
# batching PR in step 1 -- fewer, larger kernel submissions on a box whose
# decode is already pinned at the bandwidth ceiling (#317).
