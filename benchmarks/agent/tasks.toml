# --- the first MTP arm that is actually an MTP arm (#151, #39) --------------
#
# Measured 2026-09-08: ds4 reaches its Qwen MTP path only at `temperature <=
# 0.0f` (`ds4.c:80120 at ds4-metal ba01f5d`); above it the speculative call
# does one plain eval and returns (`ds4.c:80216 at ds4-metal ba01f5d`). A
# request omitting the field gets `DS4_DEFAULT_TEMPERATURE`, `1.0f`
# (`ds4.h:56 at ds4-metal ba01f5d`), and OpenCode's config declares
# `"temperature": false` for this model -- it is told the model takes none, so
# it sends none. Every MTP row before today was taken on an arm that could not
# draft.
#
# The temperature cannot come from OpenCode's config without changing it for
# every backend sharing the model, so these two run behind a SECOND shim
# instance on :8102 started with SHIM_TEMPERATURE=0. :8101 is untouched, and
# the 262 existing rows keep comparing.
#
# THEY COME AS A PAIR. Pinning temperature is itself a change of regime, so a
# greedy MTP arm alone cannot separate speculation from greedy decoding. The
# control below is the same stack, same shim, same temperature, MTP off.

[backend.qwen38fnds4mtp7greedy]
description = "Qwen3.8-Flash-Next Q4 fast-pack on ds4-metal ba01f5d, tool-format shim with temperature pinned to 0, embedded MTP --mtp-draft 7"
