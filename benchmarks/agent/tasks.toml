# has no such graph -- it parses all fourteen of our qwen4exp.ple.* keys and
# then refuses the architecture. Both GGUFs we hold are qwen4exp.
#
# No `engine_url` and no shim. The ds4 arm sits behind ds4_qwen_tool_shim.py,
# whose strip is worth 23 points (#112); this arm needs none -- 28 probe
# completions returned a proper tool_calls array and none carried scaffolding.
# So `route_query_port` resolves to 11234, `ds4_route.route_for` returns
# `unrecorded`, and `shim_strip.strip_for` returns None. All three are honest:
# the Metal route is a ds4 concept and this row must not inherit its
# provenance (#149).
