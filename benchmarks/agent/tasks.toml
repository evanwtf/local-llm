# AtomicChat's `-M64` build of Qwen3.8-Flash-Next: the same model as
# qwen38fnq2/q3, at a BETTER quant (Q4_K_M, 4.27bpw) that should not fit --
# 88.0 GiB of file against a 112.00 GiB Metal ceiling, before KV.
#
# It is here to test one claim (#33, #34): the 51B n-gram PLE table is a lookup
# structure that does no arithmetic, and `-M64` isolates it into its own shard
# so it can be paged from SSD instead of held resident. Shard 00002 is
# 35.76 GiB; the other 32 are 0.65-1.9 GiB each. If the split works, resident
# lands far below 88 GiB and a 4-bit quant becomes affordable on this machine
# for the first time.
#
# THE MEASUREMENT IS `resident vs file size`, not pass rate. Compare against
# qwen38fnq3 (83.8 GiB file, 88.2 GiB resident -- 4.4 GiB ABOVE its file).
#
# CAVEAT -- COST IS NOT ZERO. The disk baseline (benchmarks/disk/RESULTS.md)
# says a ~100-byte PLE lookup cannot cost less than one 4 KiB block: 61 us.
# One lookup per token is free; eight would put prefill 30% into disk wait, and
# #14 established that re-prefill dominates agent wall time here. "Lossless" in
# the source claim is about output, not about time. Read the suite wall clock,
# not just the verdict.
#
# CODEX GOES THROUGH THE SHIM NOW, not direct to :8020. Codex 0.150.1 sends a
# top-level `instructions` string AND a role="developer" item inside `input`;
# llama-server maps each to a chat system message, and the Qwen template raises
# "System message must be at the beginning" on the second. 0.148 sent only one,
# so the direct path worked until the client was upgraded on 2026-08-28. The
# shim's fold_developer() merges them. Every llama.cpp codex profile was moved
# to the shim port for the same reason.
#
# Same engine and flags as qwen38fnq2/q3, so the quant and the PLE split are
# what move. Started with:
#   MODEL=... ALIAS=qwen3.8-flash-next-q4m64 BACKEND=qwen38fnq4m64 llamacpp-up start
[backend.qwen38fnq4m64]
description = "Qwen3.8-Flash-Next, AtomicChat AD-4.27bpw-Q4_K_M-M64, PLE table split for SSD paging"
base_url = "http://127.0.0.1:11500"
auth_token = "llamacpp-local"
model = "qwen3.8-flash-next-q4m64"
codex_profile = "qwen38fnq4m64"
props_url = "http://127.0.0.1:8020"
context_tokens = 131072

# THE ENGINE CONTROL (#28). The same bytes as `ornith15`, served by llama.cpp
# instead of Ollama.
#
# This is the comparison this project has never had. Every llama.cpp-vs-Ollama
# claim in RESULTS.md is inferred across *different models* -- ds4 exists only
# on ds4-server, GLM only on llama.cpp, Qwen3.8-Flash-Next only on llama.cpp
# because the Ollama tag cannot load. No model here has ever run on more than
# two engines, and the only fixed-model engine pair measured is Ollama vs MTPLX.
#
# It needs no download. Ollama stores `ornith-1.5:35b` as a plain Q4_K_M GGUF
# in its blob store, and llama.cpp reads it directly:
#
#   ~/.ollama/models/blobs/sha256-aaeb640f98a892980ef54876024293cc8d6987a86523aa1b947ffa9274ef800a
#   general.architecture = qwen35moe, general.name = Ornith-1.5-35B, 20.22 GiB
#
# So the weights, the quant and the file are byte-identical between the two
# backends and **the engine is the only variable that moves**. That has not been
# true of any pair in this file before.
#
# DO NOT let Ollama garbage-collect that blob: `ollama rm ornith-1.5:35b` would
# delete the file this backend serves.
#
# Codex reaches it through the shim on :11500, like every other llama.cpp
# backend -- see the note on qwen38fnq4m64 for why the direct path stopped
# working at Codex 0.150.1.
[backend.ornith15llamacpp]
description = "Ornith-1.5-35B-A3B Q4_K_M, the identical Ollama GGUF served by llama.cpp"
base_url = "http://127.0.0.1:11500"
auth_token = "llamacpp-local"
model = "ornith-1.5-35b-llamacpp"
codex_profile = "ornith15llamacpp"
props_url = "http://127.0.0.1:8020"
context_tokens = 262144

# GLM-5.2 via ds4 SSD streaming. **A model this project ruled out on size.**
#
# 196.6 GiB of file against a 112.00 GiB Metal ceiling: impossible resident, and
# that is why #17 stalled and why #35 filed it under "too big for this machine".
# #34 changed the premise -- ds4 expert streaming measured **91.0 -> 36.7 GiB
# (-60%) for +76% suite wall time and no correctness cost**. At that ratio this
# lands near ~79 GiB, which fits.
#
# It is the cheapest reach for a genuinely independent lineage: ds4 (DwarfStar)
# serves GLM natively, so it is the same engine, the same ds4-up launcher and
# the same Anthropic endpoint ds4anthropic already uses. No shim, no new build.
# The other two rejected models (Kimi K3, MiniMax M3) have no engine here that
# can serve them at all, so streaming does not help them yet.
#
# MUST be started with streaming AND without warming, or it will not load:
#   EXTRA_FLAGS='--ssd-streaming --ssd-streaming-cache-experts 40GB' WARM='' \
#     MODEL=~/models/GLM-5.2-GGUF/GLM-5.2-UD-IQ2_XXS_RoutedIQ2XXS_blk78Q2K.gguf \
#     benchmarks/ds4/0731/agent/ds4-up start
#
# --warm-weights touches every page and defeats streaming outright -- with both
# set, ds4 reported full residency and streaming appeared to do nothing (#34).
#
# CAVEAT -- QUANT: IQ2_XXS is the most aggressive quant in this file by some
# margin, and #4 showed this suite is too easy to expose quantisation damage.
# If it fails where others pass, suspect the quant before the model.
[backend.glm52ds4]
