# Agent benchmark tasks.
#
# Each task removes one function body from a real repository and asks the agent
# to restore it. The repo's own test suite is the oracle -- no judging model, no
# rubric, no partial credit. The agent either makes the tests pass or it does
# not.
#
# Targets were chosen to span difficulty: a pure byte transform, a
# roundtrip-invariant pair, durable file IO, and SQL with ranking.
#
# repo         checkout the tasks run against
# base_commit  pinned so results stay comparable as the repo moves on
# file/symbol  what gets excised. "Class.method" addresses a method.
# tests        pytest node ids that must pass, and that are run to verify
# prompt       what the agent is told. Deliberately does not name the tests --
#              finding them is part of the task.

# The target repository, pinned. `base_commit` is what the harness actually
# exports with `git archive`, so it is a commit hash and stays one -- a branch
# name would follow the branch and quietly change what is being measured.
#
# The branch exists as a safety net, not as the pin. `origin/main` was **73
# commits ahead** of this base while the local checkout sat held back on `main`,
# so a single `git pull` would have broken every benchmark with no warning.
# `local-llm-benchmark` gives the pinned state a name that nothing else wants to
# move, and lets `main` track upstream normally again.
#
#   cd ~/git/gmail-archive && git checkout local-llm-benchmark
#
# run.py refuses to start if this repo is dirty, and verifies base_commit
# exists -- but it does not check the branch, because the export is by commit.
repo = "~/git/gmail-archive"
base_commit = "56e55cc"

[[task]]
name = "mbox-strip-envelope"
file = "src/gmail_archive/mbox.py"
symbol = "strip_envelope"
tests = ["tests/test_mbox.py"]
prompt = """`strip_envelope` in src/gmail_archive/mbox.py has been removed and \
replaced with a NotImplementedError. Implement it so the existing test suite \
passes. Do not modify any test."""

[[task]]
name = "parser-mbox-quoting"
file = "src/gmail_archive/parser.py"
symbol = "unquote_mbox"
tests = ["tests/test_parser.py"]
prompt = """`unquote_mbox` in src/gmail_archive/parser.py has been removed and \
replaced with a NotImplementedError. Implement it so the existing test suite \
passes. Note that it must round-trip with `requote_mbox`. Do not modify any \
test."""

[[task]]
name = "storage-blob-put"
file = "src/gmail_archive/storage.py"
symbol = "BlobStore.put"
tests = ["tests/test_storage.py"]
prompt = """`BlobStore.put` in src/gmail_archive/storage.py has been removed \
and replaced with a NotImplementedError. Implement it so the existing test \
suite passes. Do not modify any test."""

[[task]]
name = "parser-date"
file = "src/gmail_archive/parser.py"
symbol = "_date"
tests = ["tests/test_parser.py"]
prompt = """`_date` in src/gmail_archive/parser.py has been removed and \
replaced with a NotImplementedError. Implement it so the existing test suite \
passes. Do not modify any test."""

# Not query.search: tests/test_query.py skips without
# GMAIL_ARCHIVE_TEST_DATABASE_URL, so an excision there is invisible to the
# oracle. The control check in run.py catches exactly this. To use the SQL
# surface as a task, bring up the compose stack and export that variable first.

[[task]]
name = "mbox-scan"
file = "src/gmail_archive/mbox.py"
symbol = "scan"
tests = ["tests/test_mbox.py"]
prompt = """`scan` in src/gmail_archive/mbox.py has been removed and replaced \
with a NotImplementedError. Implement it so the existing test suite passes. Do \
not modify any test."""

# --- a second target repository: Swift (#42, subtask of #4) --------------
#
# #4 established that the *repository* is the limit, not the task set:
# gmail-archive is 1,833 source lines with exactly one function carrying the
# surface that produced the only defect found in 18 trials.
#
# `~/git/monitor` is 11,265 Swift lines with 215 tests that run in 0.705 s via
# SwiftPM -- no simulator, no xcodebuild. `Package.swift` rather than an
# `.xcodeproj` is what makes it viable as an oracle that runs twice per trial.
#
# These tasks name their own `repo`, `base_commit` and `test_command`; anything
# that does not inherits the file-level defaults, so the 558 recorded rows keep
# meaning what they meant.
#
# `tests` is empty on purpose: `swift test` runs the whole suite and does not
# take pytest-style node ids. At 0.7 s that costs nothing.
#
# NOTE the stub is `fatalError`, so an excised build **crashes** the test
# bundle rather than reporting "N failed, M passed". The oracle only needs
# pass/fail, but the summary line will be a crash message.
#
# The target is pinned on its own branch for the reason gmail-archive is:
# origin/main there was 73 commits ahead of the pinned base while the checkout
# sat held back, and a routine `git pull` would have changed what every trial
# measures.

[[task]]
name = "swift-downsample-buckets"
repo = "~/git/monitor"
base_commit = "cbb85ca"
test_command = "swift test"
file = "Sources/MonitorCore/Downsample.swift"
symbol = "Downsample.buckets"
tests = []
prompt = """`Downsample.buckets` in Sources/MonitorCore/Downsample.swift has \
been removed and replaced with a fatalError. Implement it so the existing test \
suite passes. Do not modify any test."""

[[task]]
name = "swift-csv-text"
repo = "~/git/monitor"
base_commit = "cbb85ca"
test_command = "swift test"
file = "Sources/MonitorCore/CSVExport.swift"
symbol = "CSVExport.text"
tests = []
prompt = """`CSVExport.text` in Sources/MonitorCore/CSVExport.swift has been \
removed and replaced with a fatalError. Implement it so the existing test \
suite passes. Do not modify any test."""

[[task]]
name = "swift-chartaxis-spacing"
repo = "~/git/monitor"
base_commit = "cbb85ca"
test_command = "swift test"
file = "Sources/MonitorCore/ChartAxis.swift"
symbol = "ChartAxis.spacing"
tests = []
prompt = """`ChartAxis.spacing` in Sources/MonitorCore/ChartAxis.swift has been \
removed and replaced with a fatalError. Implement it so the existing test \
suite passes. Do not modify any test."""

# --- harder tasks (issue #4) ---------------------------------------------
# The five tasks above are a ceiling: seven of eight backends score 100% across
# 243 trials, so adding backends stopped producing information. They are kept --
# they still separate *clients* sharply (Codex 15/15, Claude Code 14/15,
# OpenCode 6/15 on identical weights), which is a real measurement -- but they
# cannot separate models.
#
# These three change one thing each, so a difficulty gap is attributable.

# Direction 4: the contract goes away.
#
# A matched pair with `parser-mbox-quoting` -- same repo, same function, same
# tests, same oracle. The ONLY difference is that the docstring is removed too.
# That makes the difficulty delta attributable to the missing contract and
# nothing else, which is why this is a variant rather than a new target.
#
# The target was chosen because its docstring is unusually load-bearing: it
# states that the corpus is mboxrd rather than mboxo, that stripping exactly one
# `>` is therefore the correct inverse, and that any line carrying more than one
# `>` must be reported as ambiguous. With it present the task is transcription.
# Without it, the agent has to infer the convention from `requote_mbox` and from
# the tests -- and the ambiguity flag is a second return value that no signature
# explains.
[[task]]
name = "parser-mbox-quoting-nodoc"
file = "src/gmail_archive/parser.py"
symbol = "unquote_mbox"
keep_docstring = false
tests = ["tests/test_parser.py"]
prompt = """`unquote_mbox` in src/gmail_archive/parser.py has been removed and \
replaced with a NotImplementedError. Implement it so the existing test suite \
passes. Do not modify any test."""

# Direction 1: two files that have to agree.
#
# `strip_envelope` removes the mbox `From_` envelope line; `unquote_mbox`
# reverses the `>From ` escaping that the same format applies to the body. They
# are the two halves of one convention, they live in different modules, and
# each has its own test file. Restoring either alone is a task already in this
# suite; restoring both means holding one format in mind across two edits.
#
# Both test files are the oracle, so a solution that fixes one half and breaks
# the other fails.
[[task]]
name = "mbox-quoting-both-halves"
tests = ["tests/test_mbox.py", "tests/test_parser.py"]
targets = [
    { file = "src/gmail_archive/mbox.py", symbol = "strip_envelope" },
    { file = "src/gmail_archive/parser.py", symbol = "unquote_mbox" },
]
prompt = """Two functions have been removed and replaced with \
NotImplementedError: `strip_envelope` in src/gmail_archive/mbox.py and \
`unquote_mbox` in src/gmail_archive/parser.py. Implement both so the existing \
test suite passes. Do not modify any test."""

# Direction 1 again, on a convention that is shared rather than sequential.
#
# `BlobStore.put` writes to a temporary and renames it into place;
# `sweep_temporaries` deletes the temporaries a killed run left behind. Nothing
# in the type signatures connects them -- the only link is the name the
# temporary file is given, which one function chooses and the other must match.
# An agent that picks a different scheme in each half passes neither.
#
# This is also the durability target: put must fsync before the rename, which
# no test can observe directly. Read the gate deltas on this task, not just the
# verdict.
[[task]]
name = "storage-put-and-sweep"
tests = ["tests/test_storage.py"]
targets = [
    { file = "src/gmail_archive/storage.py", symbol = "BlobStore.put" },
    { file = "src/gmail_archive/storage.py", symbol = "BlobStore.sweep_temporaries" },
]
prompt = """Two methods have been removed from src/gmail_archive/storage.py \
and replaced with NotImplementedError: `BlobStore.put` and \
`BlobStore.sweep_temporaries`. Implement both so the existing test suite \
passes. Do not modify any test."""


# --- Swift, second set (issue #45) ---------------------------------------
# #44 produced one failure in 45 trials: `ornith15 x codex` emitted Swift that
# did not compile, from a run that otherwise looked normal. That pair is also
# the one that inflated most moving from Python to Swift (2.73x, against 1.19x
# for `ds4 x claude`). #45 asks whether those two facts are related.
#
# These two targets are chosen for *surface*, not for trickiness -- more lines
# emitted is more chances to emit something unbuildable -- and each leans on a
# Swift construct with no Python equivalent, so a model transferring Python
# habits has somewhere to slip.

# `if` as an expression. The body assigns a `let` from a multi-branch `if`,
# which is a Swift 5.9 construct; the Python habit is a ternary chain or an
# early return, and both compile to something else here.
[[task]]
name = "swift-scaleladder-snap"
repo = "~/git/monitor"
base_commit = "cbb85ca"
test_command = "swift test"
file = "Sources/MonitorCore/GaugeScale.swift"
symbol = "ScaleLadder.snap"
tests = []
prompt = """`ScaleLadder.snap` in Sources/MonitorCore/GaugeScale.swift has \
been removed and replaced with a fatalError. Implement it so the existing test \
suite passes. Do not modify any test."""

# In-place mutation of an array of structs. `Glyph` is a value type, so the
# body cannot mutate `result.last` -- it has to rebuild the element and assign
# it back. A model reaching for Python's reference semantics writes something
# that does not compile rather than something that fails a test.
[[task]]
name = "swift-sevensegment-glyphs"
repo = "~/git/monitor"
base_commit = "cbb85ca"
test_command = "swift test"
file = "Sources/MonitorCore/SevenSegment.swift"
symbol = "SevenSegment.glyphs"
tests = []
prompt = """`SevenSegment.glyphs` in Sources/MonitorCore/SevenSegment.swift \
has been removed and replaced with a fatalError. Implement it so the existing \
test suite passes. Do not modify any test."""

# --- backends ------------------------------------------------------------
# Each backend is the environment Claude Code runs under. Context windows
# differ on purpose: each model gets its real window, because capping a model
# below its capability is not a fair comparison, and exceeding it makes
# auto-compact fire after the server has already truncated.

[backend.ds4]
description = "DeepSeek V4 Flash mixed q2/q4 0731 via ds4-server"
base_url = "http://127.0.0.1:8000"
auth_token = "dsv4-local"
model = "deepseek-v4-flash"
opencode_model = "ds4/deepseek-v4-flash"
context_tokens = 100000
# Aider drives ds4 through the OpenAI-compatible endpoint. litellm needs the
# openai/ prefix to route to a custom base URL rather than a hosted provider.
aider_model = "openai/deepseek-v4-flash"

[backend.qwen]
description = "Qwen3.8-27B via Ollama MLX"
base_url = "http://127.0.0.1:11434"
auth_token = "ollama"
model = "qwen3.8:27b-mlx"
context_tokens = 262144

# One generation back, same size and same MLX backend as qwen3.8:27b-mlx.
# The like-for-like control: only the model generation differs.
[backend.qwen36]
description = "Qwen3.6-27B via Ollama MLX"
base_url = "http://127.0.0.1:11434"
auth_token = "ollama"
model = "qwen3.6:27b-mlx"
context_tokens = 262144

# Coding-tuned variant at mxfp8 rather than 4-bit. Two variables move at once
# against qwen36 -- the tune and the quant -- so read it as its own data point,
# not as an isolated measurement of either.
[backend.qwen36coding]
description = "Qwen3.6-27B coding-tuned, mxfp8"
base_url = "http://127.0.0.1:11434"
auth_token = "ollama"
model = "qwen3.6:27b-coding-mxfp8"
codex_profile = "qwen36coding"
context_tokens = 262144

# Purpose-built agentic coding assistant, MIT, 34.7B MoE in 21 GB. Its baked-in
# system prompt tells it to be concise and to use tools -- the trait this
# benchmark rewards -- so it is the most direct test of whether agent tuning
# beats raw capability.
#
# CAVEAT: this is a Q4_K_M GGUF, not an MLX quant. Ollama serves GGUF through a
# different backend, so a slow or fast result here confounds model with engine.
# Record it; do not read it as a clean model-to-model comparison.
[backend.ornith]
description = "Ornith 35B, agentic coding tune, Q4_K_M GGUF"
base_url = "http://127.0.0.1:11434"
auth_token = "ollama"
model = "ornith:35b"
context_tokens = 262144

# Same weights as `qwen` -- Qwen3.8-27B -- but a different serving stack and a
# different quant. MTPLX drives the model's native multi-token-prediction head
# for self-speculative decoding: it drafts several tokens ahead and verifies
# them in one forward pass, with no separate draft model. The quant is dynamic
# 4-bit (8-bit embeddings/output head, 16-bit norms and the whole MTP head)
# rather than Ollama's flat 4-bit MLX.
#
# This is the first backend here that is not served by Ollama or ds4-server.
# MTPLX exposes its own Anthropic-compatible /v1/messages, so no shim is needed.
#
# CAVEAT: engine and quant move together against `qwen`. A gap measured here is
# "this stack versus that stack", not an isolated measurement of MTP decoding.
#
# Port 8010, not 8000: run.py treats :8000 as ds4-server and would stamp ds4
# build provenance onto these rows.
[backend.mtplx]
description = "Qwen3.8-27B via MTPLX, dynamic 4-bit, native MTP speculative decoding"
base_url = "http://127.0.0.1:8010"
auth_token = "mtplx-local"
model = "mtplx-qwen38-27b-optimized-speed"
opencode_model = "mtplx/mtplx-qwen38-27b-optimized-speed"
context_tokens = 262144

# Different family entirely -- Google, not Qwen or DeepSeek. Matched against
# qwen3.6:27b-coding-mxfp8 on quantization (mxfp8), size (32 GB vs 31 GB) and
# backend, so the lineage is the only variable that moves. Tests whether the
# tokens-per-task finding is a property of agent loops or of Qwen. See issue #1.
[backend.gemma4]
description = "Gemma 4 31B, mxfp8"
base_url = "http://127.0.0.1:11434"
auth_token = "ollama"
model = "gemma4:31b-mxfp8"
context_tokens = 262144

# Qwen3.8-Flash-Next: the preview of the Qwen4 architecture, released
# 2026-08-26. 125B total with 6B active, plus a 51B n-gram embedding table and
# a 4B MTP head; GDN + Qwen Sparse Attention hybrid instead of the GDN + gated
# attention pairing in qwen3.8:27b.
#
# DOES NOT RUN ON THIS MACHINE -- 2026-08-26. The tag loads (112 GB, 100% GPU)
# and answers a trivial /api/generate at 38.6 t/s, but any agent-sized prompt
# dies in the MLX runner:
#
#   panic: mlx: [METAL] Command buffer execution failed: Insufficient Memory
#   (00000008:kIOGPUCommandBufferCallbackErrorOutOfMemory)
#
# Ollama logs the reason: peak memory 126.51 GiB against a Metal budget of
# 107.0 GiB on 128 GiB of unified memory. The peak is FIXED -- it did not move
# at 262144, 65536 or 32768 context, at OLLAMA_NUM_PARALLEL=1, or with a q8_0
# KV cache. It is weights plus the resident 51B n-gram embedding table, not
# KV, so no serving knob reaches it. Raising iogpu.wired_limit_mb cannot close
# a 19.5 GiB gap on a 128 GiB machine either: 126.51 GiB leaves the OS ~1.5
# GiB. This entry is kept so the next smaller quant has somewhere to land.
#
# CAVEAT -- ENGINE: needs Ollama 0.33.1 or later. Rows recorded against it are
# the first in this file served by that build; earlier Ollama rows were 0.32.x.
# The per-row env capture carries the version, so read across it with care.
[backend.qwen38flashnext]
description = "Qwen3.8-Flash-Next 125B-A6B via Ollama MLX (nvfp4)"
base_url = "http://127.0.0.1:11434"
auth_token = "ollama"
model = "qwen3.8-flash-next:125b-mlx"
codex_profile = "qwen38flashnext"
context_tokens = 262144

# The same model as backend.qwen38flashnext, at a quant that fits: Unsloth's
# UD-Q2_K_XL GGUF, 78.9 GB against the 112 GB nvfp4 tag Ollama serves.
#
# CAVEAT -- ENGINE: this is the third engine in this file, after Ollama and
# ds4-server, and the first served by llama.cpp -- specifically PR #27742,
# since mainline does not know the qwen4exp architecture. Engine AND quant move
# together against every other row. Read a gap here as "this stack versus that
# stack", never as an isolated measurement of either.
#
# CAVEAT -- QUANT: 2-bit is a real quality risk, not a footnote. If this
# backend fails a task the other backends pass, suspect the quant before the
# model.
#
# One server, both clients, but not the same path to it.
#
# Codex reaches llama-server directly on :8020 over /v1/responses. Codex
# 0.148.0 removed `wire_api = "chat"`, so the profile uses "responses", which
# llama-server also serves.
#
# Claude Code cannot go direct. It appends a role="system" message to the END
# of the messages array, and the Qwen chat template raises on it:
#
#   Jinja Exception: System message must be at the beginning
#
# This is the same request-shape bug Ollama had at 0.32.13 and fixed upstream
# in 0.32.14-rc0. llama.cpp's /v1/messages does not fix it, so this repo's
# shim -- written for that Ollama bug and generic in its upstream -- is back in
# service, on :11500 in front of :8020. llamacpp-up starts both.
#
# Ports: :8000 is ds4-server, :8010 is MTPLX, :11434 is Ollama. run.py stamps
# ds4 provenance onto :8000 and Ollama digests onto :11434, so this stack stays
# clear of both.
[backend.qwen38fnq2]
description = "Qwen3.8-Flash-Next 125B-A6B, Unsloth UD-Q2_K_XL, llama.cpp PR #27742"
base_url = "http://127.0.0.1:11500"
auth_token = "llamacpp-local"
model = "qwen3.8-flash-next-q2"
codex_profile = "qwen38fnq2"
# 131072, not the 65536 tried first: at 65536 Claude Code reported autocompact
# thrashing -- three compactions in three turns -- and spent 842s on a task
# Codex finished in 109.5s. Keep this equal to CTX in llamacpp-up; the script
# checks.
props_url = "http://127.0.0.1:8020"
context_tokens = 131072

# GLM-5.3-Flash, Zhipu lineage -- the first backend here that is neither Qwen nor
# DeepSeek. That is the whole point: issue #16 records that three of four local
# backends were Qwen derivatives, which is a monoculture in a plan whose premise
# is that hosted inference becomes unavailable.
#
# 101.3 GiB file, 98.4 GiB resident at -c 65536 -np 1. This backend exists only
# because the Metal ceiling was raised from 107.52 to 112.00 GiB (issue #30) --
# at the old default it had under 9 GiB for KV.
#
# Served by llama.cpp PR #27752 (8a8d0bcc4), which declares arch "glm5next" and
# ships conversion/glm5next.py. A matched pair with Unsloth's GGUF: it loaded
# with zero errors and zero warnings and needed no patches. The earlier attempt
# (#25) paired antirez's GGUF with PR #27773, took seven source patches, and
# still emitted gibberish -- the vocabularies did not match.
#
# ================= WRONG STACK. Read before quoting these rows. =================
#
# **This is not how GLM-5.3-Flash is meant to be run**, and every row recorded
# against this backend measures a stack antirez does not support. He ships GLM
# for Mac through ds4 (DwarfStar) with his own GGUF layout, and states plainly
# that ds4 is **not a general GGUF loader** -- only layouts from its
# `download_model.sh` work. See #38.
#
# What that means for the numbers here:
#
#   glm53 x codex   15/15, suite 1362s   -- a property of THIS stack, not of GLM
#   glm53 x claude  TIMED OUT at 3600s on the easiest task, which Codex does in
#                   133.1s. Measured cause: 12.11 t/s decode, 5181-7175 tokens
#                   per turn, 428-605s per turn. The prompt cache was working
#                   (4 tokens re-evaluated), so NOT the #14 re-prefill problem.
#
# The shim is in the path of every one of those trials, and it is the prime
# suspect for the timeout -- ds4 speaks all three protocols natively and needs
# no shim, which is why the same client reaches the ds4 primary at 55/55.
#
# The architecture-name split is the concrete tell that these are different
# artifacts, and it is why #25 failed:
#
#   Unsloth GGUF (this backend)  general.architecture = glm5next
#   antirez GGUF (ds4, #38)      general.architecture = glm5-next
#
# PR #27752 declares `glm5next`, so it can never load antirez's file, and ds4
# can never load this one. They are not interchangeable.
#
# KEEP these rows -- they are a valid measurement of Unsloth-on-llama.cpp, and
# the quant differs too. Do not pool them with #38's results and do not read
# "glm53 15/15" as "GLM-5.3-Flash works".
#
# PROVISIONAL: #27752 is mergeable but NOT merged.
[backend.glm53]
description = "GLM-5.3-Flash, Unsloth UD-Q2_K_XL, llama.cpp PR #27752"
base_url = "http://127.0.0.1:11501"
auth_token = "llamacpp-local"
model = "glm-5.3-flash-q2"
codex_profile = "glm53"
props_url = "http://127.0.0.1:8030"
context_tokens = 65536

# The 3-bit sibling of qwen38fnq2, and a correction rather than an addition.
#
# qwen38fnq2 was benchmarked at UD-Q2_K_XL (73.5 GiB) because that was the quant
# in the announcement, and the ladder was never re-checked. UD-Q3_K_XL is
# 83.8 GiB and fits the Metal ceiling with ~24 GiB to spare -- it needed no
# sysctl change and no cleverness. RESULTS.md carries a caveat that "the 2-bit
# quant is a real quality risk that this suite is too easy to expose"; that risk
# was avoidable the whole time. See issue #31.
#
# Kept as a SEPARATE backend, not an edit to qwen38fnq2: the quant is part of the
# condition, so the two must stay distinguishable in results.jsonl. The 31
# existing 2-bit rows are evidence.
#
# Everything else is held constant -- same engine build, same -c 131072 -np 1,
# same Qwen sampler defaults -- so quantization is the only variable that moves.
# Measured 88.2 GiB resident from an 83.8 GiB file.
# Same weights as qwen38fnq3 (Unsloth UD-Q3_K_XL, byte-exact against the Hub),
# served by LM Studio 0.4.23 instead of our llama.cpp (#53). LM Studio is
# llama.cpp-based but ships its own server, tool-call parser and chat-template
# handling -- which is the layer that failed when OpenCode scored 1/15 against
# our llama.cpp, writing no file in 14 of 15 trials. It speaks BOTH the OpenAI
# and Anthropic protocols on :1234, so one backend serves both clients.
#
# DEVIATION FROM LM STUDIO DEFAULTS, recorded because #53 asks for defaults:
# default context is 8192, which is below the ~25-30k our agent prompts reach,
# so it would fail on configuration rather than capability. Loaded instead at
# --context-length 131072 to match the llama.cpp cell exactly, and --ttl 21600
# so the model cannot auto-unload mid-run (default TTL is 1h). GPU offload and
# everything else left at LM Studio defaults. PARALLEL=4 is its default.
# Claude Code CANNOT reach LM Studio directly. LM Studio serves /v1/messages,
# but Claude Code appends a role="system" message at the END of the messages
# array (the agent-type listing for the Agent tool) and the Qwen chat template
# raises on it:
#
#   HTTP 500 -- Jinja Exception: System message must be at the beginning
#
# 4 trials were burned learning that; they are in results.jsonl marked
# excluded, with 0 output tokens and 1 turn -- no request ever reached the
# model. This is the exact defect ollama_claude_shim.py hoist_system() was
# written for against Ollama, and the same fix works here. Same weights, same
# LM Studio server, same everything as qwen38fnq3lms; only the shim differs.
[backend.qwen38fnq3lmsshim]
