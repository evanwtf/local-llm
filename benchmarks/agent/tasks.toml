# #333: thinking off, as a measured variable rather than a tuning tip.
#
# The DGX Spark's own rows are the evidence this is worth measuring. On the
# 10-task matrix qwen36nvfp4v1dgx spends a median 472 reasoning tokens against
# 844 total output tokens, and the speculation arm spends 1344 against 1558 --
# roughly half of everything these weights emit is reasoning, on tasks that are
# small excisions. Three Nemotron backends scored 11/30 combined here with ds4
# decode runs ending finish=length, the whole budget going to reasoning (#83).
#
# Single variable, server-side. The chat template is byte-identical to the
# checkpoint's own except one condition: `enable_thinking is defined and ...
# is false` becomes `is not defined or ... is false`, so the closed
# `<think></think>` block is the default instead of an open `<think>`. Nothing
# in the client changes, and the control is qwen36nvfp4v1dgx -- same weights,
# same engine, same V1 runner, same flags, thinking on.
#
# ONE MORE DIFFERENCE, named here because it is real even though it is forced.
# This arm serves WITHOUT --reasoning-parser qwen3; the control serves with it.
# That is not an independent choice: the parser splits reasoning from content by
# finding `</think>` in the GENERATED text, and the thinking-off template emits
# the closed block in the PROMPT, so the tag never appears in the output. With
# the parser on, everything the model generates is classified as reasoning and
# the content comes back EMPTY -- verified before this arm ran: finish=stop,
# 5 completion tokens, content "". That would have scored a clean 0/30 and read
# as "thinking off destroys the model" rather than as a parser/template
# disagreement. The parser and the template have to agree; turning it off is
# what agreement looks like, not a second knob turned for its own sake.
