# Same weights, same ds4-server -- plus a shim that does THREE things. Each is
# a confound, and the third is the largest. See ds4_qwen_tool_shim.py.
#
# 1. It appends one system line naming the tool-call format. That line names a
#    serialisation format and offers no help with the task, which is what makes
#    it defensible -- closer to a chat template than to a hint.
#
# 2. **It takes tool requests off ds4's streaming path**, asking upstream for
#    stream:false and synthesising the SSE stream back to the client. This is
#    the one that mattered. ds4 logs `invalid tool call returned as assistant
#    text finish=stop [text_len=231 ...]` and off-stream that text arrives; ON
#    stream it is dropped, so the client sees nothing at all. Measured on one
#    identical request, interleaved (2026-09-03):
#
#        stream:true    tool_calls 1/12   nothing at all 11/12
#        stream:false   tool_calls 7/12   XML as text     5/12
#
#    OpenCode sets stream:true. That is the whole of the earlier 0/45.
#
# 3. It translates the XML tool dialect into real tool_calls when it appears.
#
# **A row from this backend did not stream from the engine.** Wall time is
# unaffected -- a tool call cannot be acted on before it is complete -- but do
# not compare it to a streaming backend without saying this.
#
# Three arms, interleaved, same server, same request (2026-09-03):
#     direct streaming 0/12   direct non-streaming 4/12   through the shim 12/12
#
# `qwen38fnds4` vs `qwen38fnds4shim` is the pair that measures the total cost,
# and neither is comparable to llama.cpp without saying all of this out loud.
# Arm B. Identical to qwen38fnds4shim in every respect EXCEPT that the
# ds4-server behind the shim runs with the embedded MTP head:
#
#     --mtp-model ~/models/.../qwen3.8-flash-next-q4-mtp.gguf --mtp-draft 7 --mtp-timing
#
# Depth 7 is this pack's own measured optimum (QWEN38_FLASH_NEXT.md: acceptance
# 5.737/7, and depth 8 goes EV-negative). It carries all three shim confounds
# plus MTP, and exists as a SEPARATE backend name purely so its rows cannot be
# pooled with arm A's -- same port, same shim, different engine configuration.
#
# **Read a null carefully.** The scheduler bypasses MTP on families where drafts
# are not accepted, so a loss reads as "about the same" rather than as a
# regression. --mtp-timing is not optional here: without the acceptance and
# bypass counters, "MTP did nothing" and "MTP was never engaged" are the same
# row. The pack author measured his own code-continuation family being bypassed
# exactly like novel prose, and #105 reports speculative decoding making batch-1
# decode 18% slower in another engine on this hardware. A negative result is a
# real possibility and is worth having.
#
# **ARM B VARIES TWO THINGS, NOT ONE, AND THE SECOND IS NOT SPEED.** ds4's MTP
# defaults do not preserve the sampling distribution:
#
#     --mtp-exact-sampling   "Preserve the ordinary temperature distribution
#                             instead of accepting target-matching greedy
#                             drafts directly."   <- NOT set here
#     --mtp-margin F          verifier confidence margin for fast acceptance,
#                             default 3           <- left at default
#
# Without `--mtp-exact-sampling` the engine accepts drafts that match what the
# target would greedily produce, which biases output toward greedy at any
# temperature above 0. So an arm A vs arm B difference in **pass rate** is not
# attributable to speculation alone -- the model is being sampled differently.
# Wall time is the cleaner comparison, and even that is only clean if the token
# counts match (see AGENTS.md: "a wall-time difference is a token-count
# hypothesis").
#
# This is deliberate for the first run: it measures MTP **as a user would
# switch it on**, which is a real question. It is NOT the isolation of
# speculative decoding, and #36's rule -- vary one parameter at a time -- says
# a third arm with `--mtp-exact-sampling` is what separates the two. Do not
# report an arm A/B pass-rate gap as a property of speculation without it.
[backend.qwen38fnds4mtp7shim]
description = "Qwen3.8-Flash-Next Q4 fast-pack on ds4-metal ba01f5d via the tool-format shim, embedded MTP --mtp-draft 7"
base_url = "http://127.0.0.1:8101"
