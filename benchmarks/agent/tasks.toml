# Same weights, same server, same client as `ds4` under --client opencode --
# but over the Anthropic wire protocol (/v1/messages) instead of the
# OpenAI-compatible one (/v1/chat/completions).
#
# Why this exists: the first opencode+ds4 run varied two things at once. The
# client changed AND the protocol changed, because OpenCode reached ds4-server
# through its OpenAI-compatible path while Claude Code used the Anthropic path.
# Those are different code paths with different tool-call serialization, so a
# gap could belong to either. This backend holds the protocol fixed and leaves
# the client as the only variable.
#
# Only meaningful with --client opencode. Under --client claude it is identical
# to `ds4`.
[backend.ds4anthropic]
