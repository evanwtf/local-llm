# --- script tasks -----------------------------------------------------------
# A different measurement from the excision tasks above. There the agent gets a
# repository, a failing suite and a signature, and fills in a body. Here it
# starts with an EMPTY directory and must produce a runnable artifact: correct
# filename, argv read, output on stdout. Trivial logic, real boilerplate -- and
# the boilerplate is exactly what is never exercised when scaffolding exists.
#
# No repo, so no excision, no pinned fixture, no -real stash and no answer to
# leak. That is why these are cheap enough to run across every backend x client.
#
# `checks` are [argument, expected stdout]. The checked inputs are NOT the one
# shown in the prompt: a script that hardcodes the demonstrated case fails.

[[task]]
name = "script-reverse"
kind = "script"
entrypoint = "reverse.py"
prompt = """Create a Python script that we can call from the command line that \
takes a string as input and reverses it. A successful implementation will be \
called with `python3 reverse.py hello` and will output `olleh` on a new line."""
checks = [
    ["Benchmarking", "gnikramhcneB"],
    ["a", "a"],
    ["ab cd", "dc ba"],
]

# --- replay tasks (#714) ------------------------------------------------------
# Rebuild a real feature commit from its own tests. `base_commit` is the
# commit C, on gmail-archive's `main` (ahead of the 56e55cc the tasks above
# pin). The harness exports C, puts every path in `revert` back to C^ (the
# first parent; a path C created is deleted), and C's `tests` are the
# oracle: the control check must see them fail, and `touched_tests` guards
# them exactly as it does for an excision.
#
# `revert` is every non-test file the commit touched EXCEPT the environment
# (`pyproject.toml`, `uv.lock`): the tests need C's dependencies to import at
# all, and a dependency the agent must add is a packaging exercise, not the
# feature. Docs and config examples the commit changed are reverted with the
# source, since they describe the feature.
#
# Out of the default matrix; run them with `--replay --targets sandbox`. Each
# gets its own sandbox clone, sandbox/gmail-archive@<sha7>, made by
# scripts/sync_sandbox_targets.py. scripts/verify_replay_tasks.py re-checks
# that each passes at C and fails after the revert.
#
# The prompts restate the commit message in plain terms: what the feature is
# and the constraints the message states, never the commit or its diff.

[[task]]
name = "replay-mbox-separator"
kind = "replay"
base_commit = "0ce03e6"
revert = ["src/gmail_archive/mbox.py"]
tests = ["tests/test_mbox.py"]
prompt = """An mbox writer puts a blank line before each `From_` line. That \
blank line is framing: it belongs to the file, not to the message, and a \
reader should drop it. `strip_envelope` in src/gmail_archive/mbox.py drops \
the `From_` line but keeps the blank separator line, so every message it \
returns ends with a byte that was never part of the message. Fix it: remove \
exactly one trailing newline, and only if one is present. Mail may use CRLF \
line endings, a body's own last line may be blank, and a message may have no \
trailing newline at all. tests/test_mbox.py currently fails; make it pass. \
Do not modify any test."""

