# local-llm #459: the SBSA hardware watchdog, the only layer that can act on a
# box that is powered on but unresponsive.
#
# Twice the unified pool was exhausted so hard that nothing schedulable was
# left: 2026-09-13 (six physical power-button recoveries) and 2026-09-17 (a
# remote power cycle from the smart plug). earlyoom and the per-server
# MemAvailable watcher are userspace and cannot run in that state.
#
# PID 1 pets /dev/watchdog0 every RuntimeWatchdogSec/2. If it stops -- a wedged
# kernel, a pool with nothing left to schedule -- the firmware resets the box.
[Manager]
RuntimeWatchdogSec=60
# A clean reboot that hangs is also a wedged box; reset if shutdown stalls.
RebootWatchdogSec=2min
