name: release

# A tag is the only trigger. Cutting a release is `git tag -a vX.Y.Z && git
# push --tags` and nothing else -- everything below is a gate or a publish.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Scope the uv cache to this run: setup-uv's default path accumulates
      # files across runs that the runner user cannot always read, and one
      # sibling job writing as root breaks the next release.
      #
      # This is a step, not a workflow-level `env:`, because the `runner`
      # context does not exist there. A workflow-level `${{ runner.temp }}`
      # is not an error you can see in the file -- the run is created, fails
      # instantly with "workflow file issue", and has no logs to read.
      - name: scope the uv cache to this run
        run: echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@v5

      - run: uv sync --frozen

      # Gate 1: the tag must agree with every declared version. A release
      # reporting the wrong number is invisible until something downstream
      # disagrees about which version has which fix.
      - name: the tag must match the declared version
        run: uv run python scripts/check_release_version.py "${GITHUB_REF_NAME}"

      # Gate 2: the changelog must have a section for this version. Notes are
      # generated from it, never written into the tag message.
      - name: the changelog must have a section for this version
        run: |
          uv run python scripts/release_notes.py "${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/notes.md"
          cat "${RUNNER_TEMP}/notes.md"

      # Gate 3: the suite the tag claims to have passed. Report every problem
      # in one run rather than short-circuiting on the first.
      - name: checks
        run: |
          status=0
          uv run pytest -q || status=$?
          uv run ruff format --check . || status=$?
          exit "$status"

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "${RUNNER_TEMP}/notes.md"
