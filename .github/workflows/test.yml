name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not a shallow clone. Five tests resolve the `--dir`
          # fix commit (7356460) to separate valid OpenCode rows from the 130
          # that measured a harness bug, and `git rev-list 7356460~1..HEAD`
          # cannot see it at depth 1. Every run failed on this, and the code
          # was never at fault -- the checkout was.
          fetch-depth: 0

      # A shared runner accumulates cache files across runs that this job's
      # user cannot always read; scope it to the run.

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/uv-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Sync
        run: uv sync

      # Wire the commit-time guard into a fresh checkout, or the pytest suite
      # fails on test_refuse_commit_hook.py::..._is_installed_into_the_repo --
      # that test exists so a clone that never installs the hook cannot pass.
      - name: Install pre-commit hook
        run: uv run pre-commit install

      - name: Test
        run: uv run pytest -q

      - name: Check the launcher parses
        run: sh -n claude-ollama

      # NEXT.md is generated from the open issues (#231). CI is the half of
      # the guard the pre-commit hook cannot be: the hook only fires when
      # NEXT.md is staged, so an issue closed or relabelled on the web leaves
      # the file stale with nothing local to notice. This runs on every push
      # and says so.
      #
      # It needs the API, so it must not fail the job on a GitHub hiccup --
      # `continue-on-error` makes it a report, not a gate. A queue that is a
      # day stale is a nuisance; a red main nobody can fix by editing code is
      # worse, and #129 records what a red streak costs in attention.
      - name: Is NEXT.md current?
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python scripts/make_next.py --check

      # Last, not first: Actions stops the job at the first failing step, so a
      # single reformatted line must not abort the run before pytest and hide
      # whatever the tests would have said. One run should report every
      # problem it can; the format check is the one we can most afford to
      # learn about second.
      - name: Check formatting
        run: uv run ruff format --check .
