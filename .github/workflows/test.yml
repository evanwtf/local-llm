name: pytest + ruff (CI)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not a shallow clone. Five tests resolve the `--dir`
          # fix commit (7356460) to separate valid OpenCode rows from the 130
          # that measured a harness bug, and `git rev-list 7356460~1..HEAD`
          # cannot see it at depth 1. Every run failed on this, and the code
          # was never at fault -- the checkout was.
          fetch-depth: 0

      # A shared runner accumulates cache files across runs that this job's
      # user cannot always read; scope it to the run.

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/uv-${{ github.run_id }}-${{ github.run_attempt }}

      # `--frozen` on every uv step: install exactly what the lock pins and
      # refuse to re-resolve. The lock now round-trips (#101, `6f9ef8e`
      # declared the cooldown in `[tool.uv]`), so a bare `uv run` no longer
      # rewrites it -- but `--frozen` turns a future lock/pyproject drift into
      # a red CI step instead of a silent re-resolution.
      - name: Sync
        run: uv sync --frozen

      # Wire the commit-time guard into a fresh checkout, or the pytest suite
      # fails on test_refuse_commit_hook.py::..._is_installed_into_the_repo --
      # that test exists so a clone that never installs the hook cannot pass.
      - name: Install pre-commit hook
        run: uv run --frozen pre-commit install

      # -rs names every skip and its reason (#223). This runner skips about 37
      # tests that run on the M5 Max, and a bare -q printed only the count, so
      # a guard that went quiet looked the same as one with nothing to check.
      # LOCAL_LLM_STRICT_SKIPS=1 fails the run on a skip whose reason is not in
      # conftest.py's EXPECTED_SKIPS, so a guard that goes quiet turns CI red.
      - name: Test
        env:
          LOCAL_LLM_STRICT_SKIPS: "1"
        run: uv run --frozen pytest -q -rs

      # #394: the invariant tests keyed on results.default_path() only check the
      # runner's own hardware, so this Linux runner never checks the committed
      # M5 or DGX ledgers -- a machine-local break ships green. This validates
      # EVERY committed hardware/*/results.jsonl regardless of runner, making CI
      # the real cross-machine net.
      - name: Validate all committed ledgers
        run: uv run --frozen python scripts/validate_ledgers.py

      - name: Check the launcher parses
        run: sh -n claude-ollama

      # Last, not first: Actions stops the job at the first failing step, so a
      # single reformatted line must not abort the run before pytest and hide
      # whatever the tests would have said. One run should report every
      # problem it can; the style checks are the ones we can most afford to
      # learn about second.
      #
      # `ruff check` (the linter) is run here, not only `ruff format --check`:
      # CI ran the formatter but never the linter, so 24 lint findings
      # accumulated in files nobody staged -- the pre-commit hook only lints
      # staged files, so it could not see them (#233). The status is collected
      # across both so one run reports every problem rather than stopping at the
      # first, the way CLAUDE.md's baseline job does.
      - name: Check lint and formatting
        run: |
          status=0
          uv run --frozen ruff format --check . || status=$?
          uv run --frozen ruff check . || status=$?
          exit "$status"
