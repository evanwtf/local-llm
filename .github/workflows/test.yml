name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync
        run: uv sync

      - name: Test
        run: uv run pytest -q

      - name: Check the launcher parses
        run: sh -n claude-ollama
